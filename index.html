<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mafanyolle Recoveries | Interaction Station v19</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0c0c0c; color: #f1f5f9; height: 100vh; overflow: hidden; }
        .glass { background: rgba(23, 23, 23, 0.95); border: 1px solid rgba(255,255,255,0.05); }
        .sidebar-active { background: #1e3a8a; border-left: 3px solid #3b82f6; color: white; }
        .call-bar { background: #2f5a34; border: 1px solid #3d7a44; color: #fff; }
        .input-dark { background: #171717; border: 1px solid #262626; color: white; outline: none; }
        .input-dark:focus { border-color: #3b82f6; }
        [v-cloak] { display: none; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 10px; }
    </style>
</head>
<body class="text-sm">
    <div id="app" v-cloak class="h-full flex flex-col relative">

        <!-- 1. LOGIN SCREEN -->
        <div v-if="!user" class="min-h-screen flex items-center justify-center p-4 bg-black">
            <div class="glass p-12 rounded-[2.5rem] w-full max-w-sm text-center border-t-4 border-blue-600 shadow-2xl">
                <i class="fa-solid fa-sword text-blue-500 text-6xl mb-6"></i>
                <h1 class="text-3xl font-900 text-white uppercase italic tracking-tighter mb-10 leading-none">Mafanyolle<br>Recoveries</h1>
                <form @submit.prevent="login" class="space-y-4">
                    <input v-model="auth.email" type="email" placeholder="Collector ID" class="w-full p-4 input-dark rounded-2xl text-center" required>
                    <input v-model="auth.password" type="password" placeholder="Passkey" class="w-full p-4 input-dark rounded-2xl text-center" required>
                    <button type="submit" :disabled="loading" class="w-full bg-blue-600 hover:bg-blue-500 p-5 rounded-2xl font-black uppercase text-xs shadow-xl transition-all">
                        {{ loading ? 'Synchronizing...' : 'Initialize Session' }}
                    </button>
                </form>
            </div>
        </div>

        <!-- 2. WORKSTATION INTERFACE -->
        <template v-else>
            <!-- TOP NAV (Matched to Screenshot) -->
            <header class="h-14 bg-[#0a0a0a] border-b border-white/5 flex items-center justify-between px-4 z-50 shrink-0">
                <div class="flex items-center gap-6">
                    <i class="fa-solid fa-bars text-white/50 cursor-pointer"></i>
                    <div class="flex items-center gap-2">
                        <div class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center font-black">M</div>
                        <span class="font-black text-xs uppercase tracking-tighter italic">Mafanyolle recoveries</span>
                    </div>
                </div>

                <div class="flex items-center gap-6">
                    <div class="relative w-64">
                        <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-white/20"></i>
                        <input v-model="searchQuery" @keyup.enter="searchMatter" class="w-full p-1.5 pl-10 input-dark rounded-md text-xs italic" placeholder="Global Search...">
                    </div>
                    <div class="flex items-center gap-2 px-3 py-1 bg-emerald-950/30 border border-emerald-500/20 rounded-md">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span class="text-[10px] font-black uppercase text-emerald-500 tracking-tighter">Available</span>
                        <span class="font-mono text-white text-xs border-l border-white/10 pl-2 ml-2">{{ statusTimer }}</span>
                    </div>
                    <button @click="logout" class="text-white/30 hover:text-white"><i class="fa-solid fa-power-off text-lg"></i></button>
                </div>
            </header>

            <!-- CALL STATUS BAR (Appears during call - Matched to Screenshot) -->
            <div v-if="onCall" class="call-bar h-10 px-4 flex items-center justify-between animate-in slide-in-from-top">
                <div class="flex items-center gap-4 text-[10px] font-bold">
                    <i class="fa-solid fa-phone text-emerald-400"></i>
                    <span class="uppercase tracking-tighter">Dialling From: +27314976743 | Speaking To: {{ activeMatter.phone }}</span>
                </div>
                <div class="flex items-center gap-4">
                    <div class="font-mono text-xs">{{ talkTimer }}</div>
                    <div class="flex gap-4 border-l border-white/20 pl-4">
                        <i class="fa-solid fa-microphone-slash cursor-pointer opacity-50"></i>
                        <i class="fa-solid fa-pause cursor-pointer opacity-50"></i>
                        <i @click="endCall" class="fa-solid fa-phone-slash text-red-400 cursor-pointer"></i>
                    </div>
                </div>
            </div>

            <div class="flex-1 flex overflow-hidden">
                <!-- LEFT SIDEBAR: Work Items (Matched to Screenshot) -->
                <aside class="w-64 bg-[#111111] border-r border-white/5 flex flex-col shrink-0">
                    <div class="p-4 border-b border-white/5 flex justify-between items-center bg-[#1a1a1a]">
                        <span class="font-black text-[10px] uppercase tracking-tighter text-blue-400"><i class="fa-solid fa-comments mr-2"></i> Work Items</span>
                        <i class="fa-solid fa-chevron-left text-xs opacity-50 cursor-pointer"></i>
                    </div>
                    <div class="p-2">
                        <select class="w-full p-2 input-dark rounded text-[10px] font-black uppercase">
                            <option>My Work Items</option>
                        </select>
                    </div>
                    <div class="flex-1 overflow-y-auto">
                        <div v-if="activeMatter" class="p-4 bg-blue-600/10 border-l-4 border-blue-500 flex gap-3 cursor-pointer">
                            <div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center font-black text-xs text-white">
                                <i class="fa-solid fa-phone"></i>
                            </div>
                            <div>
                                <p class="font-bold text-[10px] uppercase truncate w-32 text-white">{{ activeMatter.name }}</p>
                                <p class="text-[9px] text-white/50">{{ activeMatter.last_worked_at || '12:44 pm' }}</p>
                            </div>
                        </div>
                    </div>
                </aside>

                <!-- CENTER WORK AREA: Large Interaction Zone -->
                <main class="flex-1 flex flex-col bg-black overflow-hidden relative">
                    <div v-if="!activeMatter" class="flex-1 flex flex-col items-center justify-center opacity-10">
                        <i class="fa-solid fa-sword text-9xl"></i>
                    </div>
                    <div v-else class="flex-1 flex flex-col overflow-hidden">
                        <!-- Middle Tab Strip -->
                        <div class="h-10 bg-[#1a1a1a] flex border-b border-white/5 px-4 items-center gap-8">
                            <span class="text-[10px] font-black uppercase border-b-2 border-blue-500 text-white h-full flex items-center px-2 cursor-pointer">Interaction History</span>
                            <span @click="showAdd = true" v-if="role === 'admin'" class="text-[10px] font-black uppercase text-white/40 h-full flex items-center px-2 cursor-pointer hover:text-white">Admin Tools</span>
                        </div>
                        
                        <!-- History Feed -->
                        <div class="flex-1 overflow-y-auto p-10 space-y-6">
                            <div v-for="log in (activeMatter.work_history || []).slice().reverse()" class="glass p-6 rounded-3xl border border-white/5">
                                <div class="flex justify-between text-[9px] font-black uppercase text-blue-500 mb-2"><span>Collector: {{ log.agent }}</span><span>{{ log.date }}</span></div>
                                <div class="text-[11px] font-black text-white uppercase mb-2">WRAP: {{ log.outcome }}</div>
                                <p class="text-sm text-white/60 italic font-medium leading-relaxed">"{{ log.note }}"</p>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Floating Record Button (Bottom Right) -->
                    <button @click="showWrap = true" v-if="activeMatter && !onCall" class="absolute bottom-8 right-8 w-14 h-14 bg-emerald-600 rounded-full flex items-center justify-center shadow-2xl hover:scale-110 transition-all text-white text-xl">
                        <i class="fa-solid fa-file-signature"></i>
                    </button>
                </main>

                <!-- RIGHT SIDEBAR: Customer Info (Matched to Screenshot) -->
                <aside v-if="activeMatter" class="w-80 bg-[#111111] border-l border-white/5 flex flex-col shrink-0 overflow-y-auto p-6">
                    <div class="mb-8">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-black text-[10px] uppercase text-slate-500 tracking-tighter">Customer Information</h3>
                            <i class="fa-solid fa-folder-plus text-slate-700 hover:text-white cursor-pointer"></i>
                        </div>
                        <div class="flex items-start gap-3 mb-6">
                            <div class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center"><i class="fa-solid fa-user text-white"></i></div>
                            <div>
                                <h2 class="font-black uppercase text-white tracking-tighter leading-none mb-1">{{ activeMatter.name }}</h2>
                                <p class="text-[10px] font-bold text-slate-500 uppercase italic">Ref: {{ activeMatter.ref_number }}</p>
                            </div>
                        </div>
                        
                        <!-- Phone List -->
                        <div class="space-y-4">
                            <div v-for="i in 4" :key="i" class="flex items-center justify-between group">
                                <div class="flex items-center gap-3">
                                    <i @click="startCall(i === 1 ? activeMatter.phone : activeMatter['tel_'+i])" class="fa-solid fa-phone text-emerald-500 opacity-0 group-hover:opacity-100 cursor-pointer transition"></i>
                                    <span class="text-xs font-mono text-slate-300">{{ i === 1 ? activeMatter.phone : (activeMatter['tel_'+i] || '---') }}</span>
                                </div>
                                <span class="text-[9px] font-bold text-slate-600 uppercase tracking-widest">(Tel {{ i }})</span>
                            </div>
                        </div>
                    </div>

                    <div class="pt-8 border-t border-white/5">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-black text-[10px] uppercase text-slate-500 tracking-tighter">Financial Ledger</h3>
                        </div>
                        <div class="space-y-4">
                            <div class="flex justify-between">
                                <span class="text-[10px] uppercase font-bold text-slate-500">Liability:</span>
                                <span class="text-lg font-black text-white italic">R {{ formatMoney(activeMatter.total_debt) }}</span>
                            </div>
                            <div class="flex justify-between">
                                <span class="text-[10px] uppercase font-bold text-slate-500">Recaptured:</span>
                                <span class="text-md font-black text-emerald-500 italic">R {{ formatMoney(activeMatter.collected_amount) }}</span>
                            </div>
                        </div>
                    </div>
                </aside>
            </div>
        </template>

        <!-- WRAP UP MODAL -->
        <div v-if="showWrap" class="fixed inset-0 bg-black/95 backdrop-blur-xl flex items-center justify-center p-4 z-[100]">
            <div class="glass w-full max-w-xl p-10 rounded-[3rem] border-t-8 border-blue-600 shadow-2xl text-left">
                <h2 class="text-3xl font-900 uppercase italic mb-8">Matter Outcome</h2>
                <div class="space-y-6 text-slate-900">
                    <label class="text-[10px] font-black uppercase text-slate-400 block mb-1">Select Interaction Tag</label>
                    <select v-model="wrapUp.outcome" class="w-full p-4 bg-white rounded-xl text-xs font-black uppercase outline-none shadow-xl">
                        <option value="PTP">Promise to Pay (PTP)</option>
                        <option value="REFUSAL">Refusal to Pay</option>
                        <option value="NA">No Answer</option>
                        <option value="PAID">Account Settled Full</option>
                    </select>

                    <div v-if="wrapUp.outcome === 'PTP'" class="grid grid-cols-2 gap-4 animate-in slide-in-from-right">
                        <div><label class="text-[9px] font-black uppercase">Arrangement Amount</label><input v-model="wrapUp.amount" type="number" class="w-full p-4 border rounded-xl" placeholder="R 0.00"></div>
                        <div><label class="text-[9px] font-black uppercase">Arrangement Date</label><input v-model="wrapUp.date" type="date" class="w-full p-4 border rounded-xl"></div>
                    </div>

                    <textarea v-model="wrapUp.note" rows="4" class="w-full p-6 border rounded-3xl text-sm italic font-medium" placeholder="Interaction narrative..."></textarea>
                    <button @click="finalizeInteraction" class="w-full bg-[#0070c0] text-white p-5 rounded-2xl font-black uppercase text-xs shadow-2xl">Submit Outcome to Ledger</button>
                    <button @click="showWrap = false" class="w-full text-slate-500 text-[10px] font-bold uppercase mt-4 text-center">Abort Action</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        const { createApp } = Vue;
        const S_URL = 'https://idxtnkisgqucufafjidv.supabase.co';
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlkeHRua2lzZ3F1Y3VmYWZqaWR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMjI2MTEsImV4cCI6MjEwMjg5ODYxMX0.Oi0_qsMfQUbE3V5uoi1VOSjPwks41xy65tG77v_ICyc';
        const client = supabase.createClient(S_URL, S_KEY);

        createApp({
            data() {
                return {
                    user: null, role: 'collector', loading: false, view: 'work', uiTab: 'history',
                    auth: { email: '', password: '' }, searchQuery: '', activeMatter: null,
                    agentStatus: 'Ready', statusSecs: 0, showWrap: false, showAdd: false,
                    onCall: false, talkSecs: 0,
                    wrapUp: { outcome: 'PTP', date: '', note: '', amount: 0 },
                    searchQuery: ''
                }
            },
            computed: {
                statusTimer() { return new Date(this.statusSecs * 1000).toISOString().substr(11, 8); },
                talkTimer() { return new Date(this.talkSecs * 1000).toISOString().substr(11, 8); }
            },
            methods: {
                formatMoney(v) { return new Intl.NumberFormat('en-ZA').format(v || 0); },
                async login() {
                    this.loading = true;
                    const { data, error } = await client.auth.signInWithPassword(this.auth);
                    if(error) { alert(error.message); this.loading = false; }
                },
                async initApp() {
                    const { data: prof } = await client.from('profiles').select('role').eq('id', this.user.id).single();
                    this.role = prof?.role || 'collector';
                    this.statusSecs = 0;
                    setInterval(() => { this.statusSecs++; if(this.onCall) this.talkSecs++; }, 1000);
                },
                async searchMatter() {
                    const { data } = await client.from('debtors').select('*').eq('ref_number', this.searchQuery).maybeSingle();
                    if(data) { this.activeMatter = data; this.searchQuery = ''; }
                    else alert("Search produced no results.");
                },
                startCall(number) {
                    if(!number && this.activeMatter) number = this.activeMatter.phone;
                    document.getElementById('ringing').play();
                    this.onCall = true; this.talkSecs = 0;
                    // Auto-open wrap modal is NOT used here to match screenshot behavior
                },
                endCall() {
                    this.onCall = false;
                    document.getElementById('ringing').pause();
                    this.showWrap = true; // Show mandatory wrap up on hangup
                },
                async finalizeInteraction() {
                    const log = { agent: this.user.email.split('@')[0], date: new Date().toLocaleString(), outcome: this.wrapUp.outcome, note: this.wrapUp.note };
                    const history = [...(this.activeMatter.work_history || []), log];
                    await client.from('debtors').update({ work_history: history, last_outcome: this.wrapUp.outcome }).eq('id', this.activeMatter.id);
                    this.showWrap = false; this.activeMatter = null;
                },
                async logout() { await client.auth.signOut(); window.location.reload(); }
            },
            mounted() {
                client.auth.onAuthStateChange((event, session) => {
                    if (session) { this.user = session.user; this.initApp(); }
                    else { this.user = null; }
                });
            }
        }).mount('#app');
    </script>
</body>
</html>
