<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mafanyolle Recoveries | Command Suite v16.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=JetBrains+Mono&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #020617; color: #f1f5f9; height: 100vh; overflow: hidden; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(14px); border: 1px solid rgba(59, 130, 246, 0.1); }
        .lcd-display { background: #050505; border: 2px solid #1e293b; box-shadow: inset 0 0 20px #000; color: #3b82f6; font-family: 'JetBrains Mono', monospace; }
        .sidebar-active { background: rgba(59, 130, 246, 0.2); border-left: 4px solid #3b82f6; color: white; }
        .header-blue { background-color: #002d5b; border-bottom: 3px solid #0070c0; }
        .accordion-bar { background: white; color: #334155; border: 1px solid #e2e8f0; cursor: pointer; padding: 12px 20px; font-weight: 700; font-size: 11px; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center; }
        [v-cloak] { display: none; }
    </style>
</head>
<body class="bg-slate-950">
    <div id="app" v-cloak class="h-full flex flex-col">
        <audio id="beep" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>
        <audio id="ringing" src="https://assets.mixkit.co/active_storage/sfx/1355/1355-preview.mp3" loop></audio>

        <!-- 1. OFFICIAL LOGIN SCREEN -->
        <div v-if="!user" class="min-h-screen flex items-center justify-center p-4">
            <div class="glass p-12 rounded-[3.5rem] w-full max-w-md shadow-2xl text-center border-t-8 border-blue-600 animate-in fade-in zoom-in duration-500">
                <i class="fa-solid fa-shield-halved text-blue-500 text-6xl mb-6"></i>
                <h1 class="text-3xl font-900 text-white uppercase italic tracking-tighter mb-10">Mafanyolle<br>Recoveries</h1>
                <form @submit.prevent="login" class="space-y-4">
                    <input v-model="auth.email" type="email" placeholder="Collector ID" class="w-full p-4 bg-slate-950 border border-slate-700 rounded-2xl outline-none focus:border-blue-500 text-white" required>
                    <input v-model="auth.password" type="password" placeholder="Passkey" class="w-full p-4 bg-slate-900 border border-slate-700 rounded-2xl outline-none focus:border-blue-500 text-white" required>
                    <button type="submit" :disabled="loading" class="w-full bg-blue-600 hover:bg-blue-500 p-5 rounded-2xl font-black uppercase tracking-widest transition shadow-xl">
                        {{ loading ? 'Synchronizing...' : 'Initialize Terminal' }}
                    </button>
                </form>
            </div>
        </div>

        <!-- 2. ENTERPRISE SUITE -->
        <template v-else>
            <!-- Top Status Strip -->
            <header class="h-16 header-blue flex items-center justify-between px-8 z-50 shadow-xl">
                <div class="flex items-center gap-10 text-white">
                    <div class="flex items-center gap-2"><i class="fa-solid fa-bars mr-4"></i><span class="font-900 italic tracking-widest">MAFANYOLLE FINANCE</span></div>
                    <div class="flex items-center gap-4 bg-slate-900/50 px-4 py-1.5 rounded-full border border-blue-500/30">
                        <span class="text-[9px] font-black uppercase text-emerald-400 animate-pulse italic">Ready</span>
                        <span class="font-mono text-blue-400 text-lg border-l border-white/10 pl-4">{{ statusTimer }}</span>
                    </div>
                </div>
                <div class="flex items-center gap-6">
                    <button v-if="role !== 'collector'" @click="showAdd = true" class="bg-white text-blue-900 px-4 py-1.5 rounded font-black text-[10px] uppercase shadow-lg">+ Load Intake</button>
                    <button @click="logout" class="text-white/50 hover:text-white transition"><i class="fa-solid fa-power-off text-xl"></i></button>
                </div>
            </header>

            <div class="flex-1 flex overflow-hidden">
                <!-- Sidebar -->
                <nav class="w-20 lg:w-64 glass border-r border-blue-900/20 flex flex-col p-4 shrink-0">
                    <div class="flex-1 space-y-2 mt-4 text-slate-400 uppercase font-black text-[10px] tracking-widest">
                        <button @click="view = 'work'" :class="view === 'work' ? 'sidebar-active text-white' : ''" class="w-full flex items-center gap-4 px-4 py-4 rounded-2xl"><i class="fa-solid fa-headset text-lg"></i> <span class="hidden lg:block">Workstation</span></button>
                        <button @click="view = 'chat'" :class="view === 'chat' ? 'sidebar-active text-white' : ''" class="w-full flex items-center gap-4 px-4 py-4 rounded-2xl relative"><i class="fa-solid fa-comments text-lg"></i> <span class="hidden lg:block">Internal Chat</span></button>
                        <button v-if="role !== 'collector'" @click="view = 'monitoring'" :class="view === 'monitoring' ? 'sidebar-active text-white' : ''" class="w-full flex items-center gap-4 px-4 py-4 rounded-2xl text-amber-500"><i class="fa-solid fa-tower-broadcast text-lg"></i> <span class="hidden lg:block">Floor View</span></button>
                    </div>
                    <div class="mt-auto p-4 bg-slate-900/50 rounded-2xl text-center border border-white/5">
                        <div class="text-[8px] text-slate-500 uppercase font-black">Logged As</div>
                        <div class="text-[10px] font-bold truncate">{{ user.email }}</div>
                    </div>
                </nav>

                <!-- Workspace -->
                <div class="flex-1 overflow-hidden bg-[#f1f5f9] text-slate-900 relative">
                    
                    <!-- ACCOUNT LOOKUP (Starting screen) -->
                    <div v-if="view === 'work' && !activeMatter" class="h-full flex items-center justify-center p-6">
                        <div class="bg-white p-12 rounded-3xl shadow-2xl border w-full max-w-2xl text-center">
                            <i class="fa-solid fa-folder-tree text-8xl text-slate-200 mb-6"></i>
                            <h2 class="text-3xl font-900 uppercase text-blue-900 tracking-tighter mb-2">Matter Selection</h2>
                            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-10">Search by Reference or Account No.</p>
                            <div class="relative w-full max-w-lg mx-auto">
                                <i class="fa-solid fa-search absolute left-6 top-1/2 -translate-y-1/2 text-slate-300"></i>
                                <input v-model="searchQuery" @keyup.enter="searchMatter" class="w-full p-6 pl-14 bg-slate-50 border border-slate-300 rounded-full outline-none text-lg text-slate-900 focus:border-blue-500 shadow-inner" placeholder="Enter Ref Number...">
                            </div>
                        </div>
                    </div>

                    <!-- FOCUSED MATTER (Screenshot 1 Layout) -->
                    <div v-if="view === 'work' && activeMatter" class="h-full flex flex-col animate-in slide-in-from-bottom duration-500">
                        <div class="bg-white p-6 border-b-2 border-blue-600 flex justify-between items-center shadow-lg">
                            <div class="flex items-center gap-6">
                                <div class="w-14 h-14 bg-amber-500 rounded-full flex items-center justify-center text-white text-2xl shadow-xl"><i class="fa-solid fa-user"></i></div>
                                <div>
                                    <h2 class="text-2xl font-black uppercase text-blue-900 tracking-tighter leading-none">{{ activeMatter.name }}</h2>
                                    <div class="text-[11px] font-black text-amber-600 uppercase tracking-widest mt-1">{{ activeMatter.id_number }} (ME)</div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-[11px] font-black text-slate-400 uppercase">Current Balance</div>
                                <div class="text-4xl font-black text-slate-800 italic">R {{ formatMoney(activeMatter.total_debt) }}</div>
                            </div>
                        </div>

                        <!-- Main Screen Split -->
                        <div class="flex-1 flex overflow-hidden">
                            <!-- Left: Details (Verify Section) -->
                            <div class="w-3/4 overflow-y-auto bg-[#eef2f6] border-r">
                                <div class="bg-[#0070c0] text-white p-3 font-black text-center text-2xl uppercase tracking-[0.3em]">Verify Account</div>
                                
                                <div class="p-6 space-y-4">
                                    <div class="bg-white border rounded overflow-hidden">
                                        <div class="accordion-bar" @click="uiTab = 'history'"><span><i class="fa-solid fa-history mr-2 text-blue-500"></i> Action History</span><i class="fa-solid fa-chevron-down"></i></div>
                                        <div v-if="uiTab === 'history'" class="p-6 bg-slate-50 animate-in fade-in space-y-4">
                                            <div v-for="log in (activeMatter.work_history || []).slice().reverse()" class="border-l-4 border-blue-500 p-3 bg-white shadow-sm rounded-r-lg">
                                                <div class="flex justify-between text-[9px] font-black uppercase text-slate-400 mb-1"><span>{{ log.agent }}</span><span>{{ log.date }}</span></div>
                                                <p class="text-xs font-bold text-slate-700 italic">"{{ log.note }}"</p>
                                            </div>
                                        </div>

                                        <div class="accordion-bar border-t" @click="uiTab = 'details'"><span><i class="fa-solid fa-address-card mr-2 text-blue-500"></i> Contact Details</span><i class="fa-solid fa-chevron-down"></i></div>
                                        <div v-if="uiTab === 'details'" class="p-6 grid grid-cols-3 gap-6 bg-slate-50 animate-in fade-in text-xs font-bold uppercase tracking-widest text-slate-500">
                                            <div><p class="mb-1 opacity-50">Phone Number</p><p class="text-blue-700 font-900">{{ activeMatter.phone }}</p></div>
                                            <div><p class="mb-1 opacity-50">Matter Ref</p><p class="text-slate-900 font-900">{{ activeMatter.ref_number }}</p></div>
                                            <div><p class="mb-1 opacity-50">Tax Type</p><p class="text-emerald-600 font-900">{{ activeMatter.tax_type || 'INCOME_TAX' }}</p></div>
                                        </div>

                                        <div class="accordion-bar border-t" @click="uiTab = 'docs'"><span><i class="fa-solid fa-file-pdf mr-2 text-red-500"></i> Document Vault</span><i class="fa-solid fa-chevron-down"></i></div>
                                        <div v-if="uiTab === 'docs'" class="p-6 bg-slate-50 grid grid-cols-2 gap-4 animate-in fade-in">
                                            <div v-for="doc in activeMatter.documents" class="flex justify-between p-3 bg-white border rounded">
                                                <span class="text-[10px] font-black uppercase">{{ doc.name }}</span>
                                                <a :href="doc.url" target="_blank" class="text-blue-600"><i class="fa-solid fa-download"></i></a>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Right: Telephony Hub -->
                            <div class="w-1/4 bg-white shadow-2xl flex flex-col p-6 items-center">
                                <div class="lcd-display w-full p-6 rounded-2xl text-center mb-8 relative">
                                    <div class="text-[9px] font-black uppercase text-blue-900/30 mb-2">Telephony Link</div>
                                    <div class="text-xl font-bold tracking-tighter mb-4">{{ activeMatter.phone }}</div>
                                    <div v-if="onCall" class="text-2xl font-black text-emerald-500 animate-pulse">{{ talkTimer }}</div>
                                    <button v-if="!onCall" @click="startCall" class="w-16 h-16 bg-emerald-500 rounded-full text-white text-3xl shadow-xl hover:scale-110 transition-all"><i class="fa-solid fa-phone"></i></button>
                                    <button v-else @click="endCall" class="w-16 h-16 bg-red-600 rounded-full text-white text-3xl animate-pulse transition-all"><i class="fa-solid fa-phone-slash"></i></button>
                                </div>

                                <button @click="showWrapUp = true" class="w-full bg-[#0070c0] text-white p-4 rounded font-black uppercase text-[10px] tracking-widest shadow-xl">Log Interaction</button>
                                <button @click="activeMatter = null; dialedNumber = ''" class="mt-8 text-[10px] font-black text-slate-300 uppercase hover:text-red-500">Close Matter</button>
                            </div>
                        </div>

                        <!-- 3. CALL CONCLUSION MODAL (Strict Scope) -->
                        <div v-if="showWrapUp" class="fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-[500]">
                            <div class="bg-white w-full max-w-lg p-12 rounded-lg border-t-8 border-blue-600 shadow-2xl text-slate-900 animate-in zoom-in duration-300">
                                <h2 class="text-3xl font-900 uppercase text-blue-900 italic tracking-tighter mb-8">Call Conclusion</h2>
                                <div class="space-y-6">
                                    <div>
                                        <label class="text-[10px] font-black text-slate-400 uppercase mb-1 block tracking-widest">Select Outcome</label>
                                        <select v-model="wrapUp.outcome" class="w-full p-4 bg-slate-50 border rounded text-xs font-bold outline-none">
                                            <option value="PTP">Promise to Pay (PTP)</option>
                                            <option value="REFUSAL">Refusal to Pay</option>
                                            <option value="DECEASED">Deceased - Upload Req</option>
                                            <option value="NA">No Answer / Left Message</option>
                                            <option v-if="role !== 'collector'" value="PAYMENT">Supervisor: Recaptured Payment</option>
                                        </select>
                                    </div>
                                    <div v-if="wrapUp.outcome === 'PTP'"><label class="text-[10px] font-black text-slate-400 block mb-1 uppercase tracking-widest">Arrangement Date</label><input v-model="wrapUp.dueDate" type="date" class="w-full p-4 bg-slate-50 border rounded text-white"></div>
                                    
                                    <textarea v-model="wrapUp.note" rows="4" class="w-full p-5 bg-slate-50 border rounded text-sm italic italic" placeholder="Enter interaction notes..."></textarea>
                                    <button @click="finalizeMatter" class="w-full bg-[#0070c0] text-white p-5 rounded font-black uppercase text-xs tracking-widest shadow-xl">Submit Outcome to Ledger</button>
                                    <button @click="showWrapUp = false" class="w-full text-[10px] font-black text-slate-300 uppercase mt-4">Cancel Entry</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- SUPERVISOR INTAKE MODAL -->
                <div v-if="showAdd" class="fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-[600]">
                    <div class="glass p-12 rounded-[4rem] w-full max-w-2xl border-t-8 border-blue-600 shadow-2xl">
                        <h2 class="text-3xl font-900 text-white uppercase italic tracking-tighter mb-10">New Intake Record</h2>
                        <div class="grid grid-cols-2 gap-6 mb-10">
                            <input v-for="(f,k) in addForm" v-model="addForm[k]" :placeholder="k.toUpperCase()" class="bg-slate-900 border border-slate-700 p-4 rounded-xl text-xs text-white outline-none">
                        </div>
                        <div class="flex gap-4">
                            <button @click="saveDebtor" class="flex-1 bg-blue-600 p-5 rounded-2xl font-black text-[10px] uppercase shadow-xl hover:bg-white hover:text-blue-900">Commit Intake</button>
                            <button @click="showAdd = false" class="flex-1 bg-slate-800 text-slate-500 p-5 rounded-2xl font-black text-[10px] uppercase">Abort</button>
                        </div>
                    </div>
                </div>

            </div>
        </template>
    </div>

    <script>
        const { createApp } = Vue;
        const SUPABASE_URL = 'YOUR_SUPABASE_URL';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        createApp({
            data() {
                return {
                    user: null, role: 'collector', loading: false, view: 'work', uiTab: 'history',
                    auth: { email: '', password: '' }, searchQuery: '', activeMatter: null,
                    dialedNumber: '', callStatus: 'SYSTEM IDLE', onCall: false, talkSecs: 0,
                    agentStatus: 'Ready', statusSecs: 0, showWrapUp: false, showAdd: false,
                    wrapUp: { outcome: 'PTP', dueDate: '', note: '' },
                    addForm: { name: '', phone: '', ref_number: '', total_debt: 0, id_number: '' }
                }
            },
            computed: {
                statusTimer() { return new Date(this.statusSecs * 1000).toISOString().substr(11, 8); },
                callTimer() { return new Date(this.talkSecs * 1000).toISOString().substr(14, 5); }
            },
            methods: {
                formatMoney(v) { return new Intl.NumberFormat('en-ZA').format(v || 0); },
                async login() {
                    this.loading = true;
                    const { data, error } = await client.auth.signInWithPassword(this.auth);
                    if(error) { alert(error.message); this.loading = false; }
                },
                async initApp() {
                    const { data: prof } = await client.from('profiles').select('role').eq('id', this.user.id).single();
                    this.role = prof?.role || 'collector';
                    // MANDATORY FIX: Reset modal state on startup
                    this.showWrapUp = false;
                    this.activeMatter = null;
                    setInterval(() => { this.statusSecs++; if(this.onCall) this.talkSecs++; }, 1000);
                    client.channel('all').on('postgres_changes', { event: '*', schema: 'public' }, () => {}).subscribe();
                },
                async searchMatter() {
                    const { data, error } = await client.from('debtors').select('*').eq('ref_number', this.searchQuery).maybeSingle();
                    if(data) { this.activeMatter = data; this.dialedNumber = data.phone; this.searchQuery = ''; }
                    else alert("Ref not found in portfolio.");
                },
                startCall() { 
                    document.getElementById('ringing').play(); this.onCall = true; this.callStatus = 'DIALING LINE'; 
                    setTimeout(() => { this.callStatus = 'CONNECTED'; document.getElementById('ringing').pause(); }, 3000);
                },
                endCall() { this.onCall = false; this.callStatus = 'DISCONNECTED'; document.getElementById('ringing').pause(); this.showWrapUp = true; },
                async finalizeMatter() {
                    const history = [...(this.activeMatter.work_history || []), { date: new Date().toISOString(), agent: this.user.email, outcome: this.wrapUp.outcome, note: this.wrapUp.note }];
                    await client.from('debtors').update({ work_history: history, last_outcome: this.wrapUp.outcome, updated_at: new Date() }).eq('id', this.activeMatter.id);
                    this.showWrapUp = false; this.activeMatter = null;
                },
                async saveDebtor() {
                    await client.from('debtors').insert([{ ...this.addForm, user_id: null }]);
                    this.showAdd = false; alert("Matter Committed.");
                },
                async logout() { await client.auth.signOut(); window.location.reload(); }
            },
            mounted() {
                client.auth.onAuthStateChange((event, session) => {
                    if (session) { this.user = session.user; this.initApp(); }
                    else { this.user = null; }
                });
            }
        }).mount('#app');
    </script>
</body>
</html>
