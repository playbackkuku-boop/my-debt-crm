<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mafanyolle Recoveries | Enterprise Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=JetBrains+Mono&display=swap');
        body { font-family: 'Outfit', sans-serif; background-color: #020617; color: #f1f5f9; height: 100vh; overflow: hidden; }
        .excalibur-bg { background: linear-gradient(rgba(2, 6, 23, 0.95), rgba(2, 6, 23, 0.95)), url('https://images.unsplash.com/photo-1554224155-169641357599?q=80&w=2000&auto=format&fit=crop'); background-size: cover; background-position: center; }
        .glass { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(59, 130, 246, 0.2); backdrop-filter: blur(25px); }
        .header-blue { background-color: #002d5b; border-bottom: 3px solid #0070c0; }
        .sidebar-active { background: rgba(59, 130, 246, 0.2); border-left: 4px solid #3b82f6; color: white; }
        .accordion-bar { background: white; color: #334155; border: 1px solid #e2e8f0; cursor: pointer; padding: 12px 20px; font-weight: 700; font-size: 11px; text-transform: uppercase; display: flex; justify-content: space-between; }
        [v-cloak] { display: none; }
    </style>
</head>
<body class="excalibur-bg">
    <div id="app" v-cloak class="h-full flex flex-col">
        <audio id="beep" src="https://assets.mixkit.co/active_storage/sfx/2358/2358-preview.mp3"></audio>

        <!-- 1. LOGIN SCREEN -->
        <div v-if="!user" class="min-h-screen flex items-center justify-center p-4">
            <div class="glass p-12 rounded-[3.5rem] w-full max-w-sm text-center border-t-8 border-blue-600 shadow-2xl">
                <i class="fa-solid fa-shield-halved text-blue-500 text-6xl mb-6"></i>
                <h1 class="text-3xl font-900 text-white uppercase italic tracking-tighter mb-10">Mafanyolle<br>Recoveries</h1>
                <form @submit.prevent="login" class="space-y-4">
                    <input v-model="auth.email" type="email" placeholder="Collector ID" class="w-full p-4 bg-slate-950 border border-slate-700 rounded-2xl outline-none focus:border-blue-500 text-white" required>
                    <input v-model="auth.password" type="password" placeholder="Password" class="w-full p-4 bg-slate-950 border border-slate-700 rounded-2xl outline-none focus:border-blue-500 text-white" required>
                    <button type="submit" :disabled="loading" class="w-full bg-blue-600 hover:bg-blue-500 p-5 rounded-2xl font-black uppercase text-xs transition">
                        {{ loading ? 'Synchronizing...' : 'Initialize Terminal' }}
                    </button>
                </form>
            </div>
        </div>

        <!-- 2. MAIN APP -->
        <template v-else>
            <header class="h-16 header-blue flex items-center justify-between px-8 z-50">
                <div class="flex items-center gap-6 text-white font-900 tracking-widest italic">
                    <i class="fa-solid fa-bars mr-2"></i> MAFANYOLLE FINANCE
                </div>
                <div class="flex items-center gap-6">
                    <div class="bg-slate-950/50 px-4 py-1.5 rounded-full border border-blue-500/30 text-emerald-400 font-black uppercase text-[10px]">
                        {{ agentStatus }} | {{ statusTimer }}
                    </div>
                    <button @click="logout" class="text-white/50 hover:text-white transition"><i class="fa-solid fa-power-off text-xl"></i></button>
                </div>
            </header>

            <div class="flex-1 flex overflow-hidden">
                <!-- Sidebar -->
                <nav class="w-64 glass border-r border-blue-900/20 flex flex-col p-4 shrink-0 uppercase font-black text-[10px] tracking-widest text-slate-400">
                    <div class="flex-1 space-y-2 mt-4">
                        <button @click="view = 'work'" :class="view === 'work' ? 'sidebar-active text-white' : ''" class="w-full flex items-center gap-4 px-4 py-4 rounded-2xl"><i class="fa-solid fa-headset text-lg"></i> Workstation</button>
                        <button @click="view = 'monitoring'" v-if="role !== 'collector'" :class="view === 'monitoring' ? 'sidebar-active text-white' : ''" class="w-full flex items-center gap-4 px-4 py-4 rounded-2xl text-amber-500"><i class="fa-solid fa-tower-broadcast text-lg"></i> Floor Monitor</button>
                    </div>
                    <div class="mt-auto p-4 bg-slate-950/50 rounded-2xl border border-white/5 text-center">
                        <span class="text-blue-500">{{ role }}</span><br>{{ user.email }}
                    </div>
                </nav>

                <!-- Workspace -->
                <div class="flex-1 overflow-hidden bg-[#f1f5f9] text-slate-900">
                    
                    <!-- SEARCH START -->
                    <div v-if="!activeMatter" class="h-full flex items-center justify-center">
                        <div class="bg-white p-12 rounded-[2rem] shadow-2xl border w-full max-w-xl text-center">
                            <i class="fa-solid fa-magnifying-glass-chart text-8xl text-slate-100 mb-6"></i>
                            <h2 class="text-2xl font-900 uppercase text-blue-900 tracking-tighter mb-8">Matter Interaction Lookup</h2>
                            <div class="relative">
                                <input v-model="searchQuery" @keyup.enter="searchMatter" class="w-full p-6 bg-slate-50 border border-slate-300 rounded-full outline-none text-center text-lg shadow-inner focus:border-blue-500 transition" placeholder="Search Reference Number...">
                                <button @click="searchMatter" class="absolute right-3 top-1/2 -translate-y-1/2 bg-blue-600 text-white px-8 py-3 rounded-full font-black uppercase text-[10px]">Verify</button>
                            </div>
                        </div>
                    </div>

                    <!-- MATTER PANEL (Screenshot Style) -->
                    <div v-else class="h-full flex flex-col animate-in slide-in-from-bottom duration-500">
                        <div class="bg-white p-6 border-b-2 border-blue-600 flex justify-between items-center shadow-lg">
                            <div class="flex items-center gap-6">
                                <div class="w-14 h-14 bg-amber-500 rounded-full flex items-center justify-center text-white text-2xl shadow-lg"><i class="fa-solid fa-user"></i></div>
                                <div>
                                    <h2 class="text-2xl font-black uppercase text-blue-900 tracking-tighter">{{ activeMatter.name }}</h2>
                                    <div class="text-[11px] font-black text-amber-600 uppercase tracking-widest">{{ activeMatter.id_number }}</div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="text-[11px] font-black text-slate-400 uppercase">Current Balance</div>
                                <div class="text-4xl font-black text-slate-800 italic">R {{ formatMoney(activeMatter.total_debt) }}</div>
                            </div>
                        </div>

                        <div class="flex-1 flex overflow-hidden">
                            <!-- Left Details Accordion -->
                            <div class="w-3/4 overflow-y-auto bg-[#eef2f6] border-r">
                                <div class="bg-[#0070c0] text-white p-3 font-black text-center text-2xl uppercase tracking-[0.3em]">Verify File</div>
                                
                                <div class="p-6 space-y-4">
                                    <div class="bg-white border rounded overflow-hidden shadow-sm">
                                        <div class="accordion-bar" @click="uiTab = 'history'"><span>Action History</span><i class="fa-solid fa-history text-blue-500"></i></div>
                                        <div v-if="uiTab === 'history'" class="p-6 bg-slate-50 space-y-4 animate-in fade-in">
                                            <div v-for="log in (activeMatter.work_history || []).slice().reverse()" class="border-l-4 border-blue-500 bg-white p-4 shadow-sm rounded-r-xl">
                                                <div class="flex justify-between text-[9px] font-black text-slate-400 uppercase"><span>{{ log.agent }}</span><span>{{ log.date }}</span></div>
                                                <p class="text-xs font-bold text-slate-700 mt-1 italic">"{{ log.note }}"</p>
                                            </div>
                                        </div>

                                        <div class="accordion-bar border-t" @click="uiTab = 'details'"><span>Contact Details</span><i class="fa-solid fa-address-book text-blue-500"></i></div>
                                        <div v-if="uiTab === 'details'" class="p-8 grid grid-cols-3 gap-8 bg-slate-50 animate-in fade-in text-xs font-black uppercase tracking-widest text-slate-500">
                                            <div><p class="opacity-50 mb-2">Phone</p><p class="text-blue-700 text-lg">{{ activeMatter.phone }}</p></div>
                                            <div><p class="opacity-50 mb-2">Reference</p><p class="text-slate-900 text-lg">{{ activeMatter.ref_number }}</p></div>
                                            <div><p class="opacity-50 mb-2">Tax Type</p><p class="text-emerald-600 text-lg">INCOME_TAX</p></div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Right Interaction Hub -->
                            <div class="w-1/4 bg-white p-6 shadow-2xl flex flex-col items-center">
                                <div class="bg-slate-950 text-blue-400 p-8 rounded-3xl w-full text-center border border-blue-900/50 mb-10">
                                    <div class="text-[9px] font-black uppercase tracking-[0.3em] mb-4">Internal Dialer</div>
                                    <div class="text-2xl font-mono font-bold mb-6 tracking-tighter text-white">{{ activeMatter.phone }}</div>
                                    <button @click="startCall" class="w-16 h-16 bg-emerald-500 rounded-full text-white text-3xl shadow-xl transition-all hover:scale-110"><i class="fa-solid fa-phone"></i></button>
                                </div>
                                <button @click="showWrapUp = true" class="w-full bg-[#0070c0] text-white py-5 rounded font-black uppercase text-[10px] tracking-widest shadow-2xl">Log Interaction</button>
                                <button @click="activeMatter = null" class="mt-10 text-[9px] font-black text-slate-300 uppercase hover:text-red-500 transition">Return to Search</button>
                            </div>
                        </div>

                        <!-- 3. CONCLUSION MODAL -->
                        <div v-if="showWrapUp" class="fixed inset-0 bg-black/95 flex items-center justify-center p-4 z-[100]">
                            <div class="bg-white w-full max-w-lg p-12 rounded-[4rem] border-t-8 border-blue-600 shadow-2xl text-slate-900 animate-in zoom-in duration-300">
                                <h2 class="text-3xl font-900 uppercase text-blue-900 tracking-tighter mb-10 italic">Call Conclusion</h2>
                                <div class="space-y-6">
                                    <div>
                                        <label class="text-[10px] font-black text-slate-400 uppercase block mb-1">Select Outcome</label>
                                        <select v-model="wrapUp.outcome" class="w-full p-4 bg-slate-50 border rounded text-xs font-bold outline-none">
                                            <option value="PTP">Promise to Pay (PTP)</option>
                                            <option value="REFUSAL">Refusal to Pay</option>
                                            <option value="DECEASED">Deceased</option>
                                            <option value="NA">No Answer</option>
                                        </select>
                                    </div>
                                    <div v-if="wrapUp.outcome === 'PTP'">
                                        <label class="text-[10px] font-black text-slate-400 block mb-1 uppercase tracking-widest">PTP Arrangement Date</label>
                                        <input v-model="wrapUp.dueDate" type="date" class="w-full p-4 bg-slate-50 border rounded font-bold">
                                    </div>
                                    <textarea v-model="wrapUp.note" rows="4" class="w-full p-5 bg-slate-50 border rounded text-sm italic" placeholder="Capture interaction details..."></textarea>
                                    <button @click="finalizeMatter" class="w-full bg-[#0070c0] text-white p-5 rounded font-black uppercase text-[10px] tracking-widest">Submit Outcome to Ledger</button>
                                    <button @click="showWrapUp = false" class="w-full text-[9px] font-black text-slate-300 uppercase mt-4">Close Entry</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <script>
        const { createApp } = Vue;
        const S_URL = 'https://idxtnkisgqucufafjidv.supabase.co';
        const S_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlkeHRua2lzZ3F1Y3VmYWZqaWR2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODczMjI2MTEsImV4cCI6MjEwMjg5ODYxMX0.Oi0_qsMfQUbE3V5uoi1VOSjPwks41xy65tG77v_ICyc';
        const client = supabase.createClient(S_URL, S_KEY);

        createApp({
            data() {
                return {
                    user: null, role: 'collector', loading: false, view: 'work', uiTab: 'history',
                    auth: { email: '', password: '' }, searchQuery: '', activeMatter: null,
                    agentStatus: 'Ready', statusSecs: 0, showWrapUp: false,
                    wrapUp: { outcome: 'PTP', dueDate: '', note: '' }
                }
            },
            computed: {
                statusTimer() { return new Date(this.statusSecs * 1000).toISOString().substr(11, 8); }
            },
            methods: {
                formatMoney(v) { return new Intl.NumberFormat('en-ZA').format(v || 0); },
                async login() {
                    this.loading = true;
                    const { data, error } = await client.auth.signInWithPassword(this.auth);
                    if(error) { alert(error.message); this.loading = false; }
                },
                async initApp() {
                    const { data: prof } = await client.from('profiles').select('role').eq('id', this.user.id).single();
                    this.role = prof?.role || 'collector';
                    this.showWrapUp = false;
                    this.activeMatter = null;
                    setInterval(() => { this.statusSecs++; }, 1000);
                },
                async searchMatter() {
                    const { data, error } = await client.from('debtors').select('*').eq('ref_number', this.searchQuery).maybeSingle();
                    if(data) { this.activeMatter = data; this.searchQuery = ''; }
                    else alert("Matter not found in portfolio.");
                },
                startCall() { alert("Triggering VoIP Bridge..."); },
                async finalizeMatter() {
                    const log = { date: new Date().toISOString(), agent: this.user.email, outcome: this.wrapUp.outcome, note: this.wrapUp.note };
                    const history = [...(this.activeMatter.work_history || []), log];
                    await client.from('debtors').update({ work_history: history, last_outcome: this.wrapUp.outcome }).eq('id', this.activeMatter.id);
                    this.showWrapUp = false; this.activeMatter = null;
                },
                async logout() { await client.auth.signOut(); window.location.reload(); }
            },
            mounted() {
                client.auth.onAuthStateChange((event, session) => {
                    if (session) { this.user = session.user; this.initApp(); }
                    else { this.user = null; }
                });
            }
        }).mount('#app');
    </script>
</body>
</html>
